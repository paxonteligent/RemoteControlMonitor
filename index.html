<script>
const VALID_EMAIL="ambremallah@icloud.com";
const VALID_PASSWORD="Fearless1";
const loginForm=document.getElementById('loginForm');
loginForm.addEventListener('submit',function(event){
 event.preventDefault();
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const error=document.getElementById('loginError');
 if(email===VALID_EMAIL&&password===VALID_PASSWORD){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('profilePage').classList.remove('hidden');
  loginForm.reset();
 }else{error.textContent='Sorry, your password or email was incorrect.'}
});
function notify(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
function toggleFollow(button){const following=button.textContent==='Following';button.textContent=following?'Follow':'Following';button.style.background=following?'#4f5df5':'#efeff4';button.style.color=following?'white':'#111';notify(following?'You unfollowed chzter':'You are now following chzter')}
